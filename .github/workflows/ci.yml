name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests + headless proof scenarios + determinism (no npm install needed)
        run: npm test
      - name: Headless smoke run via contract command
        run: node src/headless.js --seed 1 --night 1 --ticks 4800 --out smoke.jsonl && tail -1 smoke.jsonl
