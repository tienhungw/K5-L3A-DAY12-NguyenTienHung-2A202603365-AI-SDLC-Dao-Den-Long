<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đảo Đèn Lồng</title>
<style>
  :root { --warm: #ffb347; --ink: #6b3fa0; --text: #fff4e0; }
  html, body { margin: 0; height: 100%; background: #0b0a1a; overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; color: var(--text); }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: absolute; background: rgba(15, 10, 35, .55); border: 1px solid rgba(255, 179, 71, .25); border-radius: 12px; padding: 8px 14px; backdrop-filter: blur(4px); }
  #stats { top: 14px; left: 14px; line-height: 1.6; font-size: 15px; }
  #stats b { color: var(--warm); }
  #timer { top: 14px; left: 50%; transform: translateX(-50%); font-size: 22px; font-variant-numeric: tabular-nums; text-align: center; }
  #timer small { display: block; font-size: 11px; opacity: .7; }
  #score { top: 14px; right: 14px; font-size: 22px; font-variant-numeric: tabular-nums; }
  #help { bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .8; white-space: nowrap; }
  #hint { bottom: 52px; left: 50%; transform: translateX(-50%); font-size: 14px; color: var(--warm); display: none; }
  .flame { display: inline-block; width: 12px; height: 16px; margin-right: 3px; border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%; background: radial-gradient(circle at 50% 70%, #fff3b0, #ff9a3c 55%, #c2410c); vertical-align: -2px; }
  .flame.off { background: #3a2f4f; }
  #title, #end { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; transition: opacity 1.2s; }
  #title h1 { font-size: 46px; margin: 0; color: var(--warm); text-shadow: 0 0 24px rgba(255, 160, 60, .7); font-weight: 600; }
  #title p { opacity: .85; }
  #end { opacity: 0; background: radial-gradient(ellipse at center, rgba(10, 6, 25, .55), rgba(10, 6, 25, .85)); }
  #end.show { opacity: 1; pointer-events: auto; }
  #end h2 { font-size: 40px; margin: 0 0 8px; }
  #end .won { color: var(--warm); } #end .lost { color: #b28ddb; }
  #end button { margin-top: 18px; font-size: 18px; padding: 10px 24px; border-radius: 10px; border: 1px solid var(--warm); background: rgba(255, 179, 71, .15); color: var(--text); cursor: pointer; }
</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="hud">
  <div id="stats" class="panel">
    <div>Lửa: <span id="flames"></span></div>
    <div>Đom đóm: <b id="carried">0</b> / <span id="cap">5</span></div>
    <div>Đèn Lồng Lớn: <b id="lit">0</b> / <span id="lcount">5</span></div>
  </div>
  <div id="timer" class="panel"><small>Đêm 1 – Đảo Bến · còn lại</small><span id="time">4:00</span></div>
  <div id="score" class="panel">✦ <span id="scoreVal">0</span></div>
  <div id="hint" class="panel"></div>
  <div id="help" class="panel">WASD di chuyển · Chuột kéo / ← → xoay camera · Space nhảy · E nộp đom đóm · F xung sáng · R chơi lại · M tắt tiếng · P tạm dừng</div>
</div>
<div id="title"><h1>Đảo Đèn Lồng</h1><p>Đêm 1 – Đảo Bến<br><small>Gom đom đóm, thắp lại 5 Đèn Lồng Lớn trước bình minh.</small></p></div>
<div id="end"><h2 id="endTitle"></h2><div id="endText"></div><button id="again">Chơi lại (R)</button></div>
<script type="module" src="/main.js"></script>
</body>
</html>
